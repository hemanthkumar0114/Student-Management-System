spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

app:
  admin:
    username: admin
    email: admin@example.com
    password: testAdminPassword123!
  jwt:
    secret: testJwtSecretKeyForTestingPurposesOnlyMustBeAtLeast32BytesLong!
    expiration: 3600000
  cors:
    allowed-origins: http://localhost:5173
