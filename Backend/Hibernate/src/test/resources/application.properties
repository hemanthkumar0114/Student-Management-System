spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.admin.username=admin
app.admin.email=admin@example.com
app.admin.password=testAdminPassword123!

app.jwt.secret=testJwtSecretKeyForTestingPurposesOnlyMustBeAtLeast32BytesLong!
app.jwt.expiration=3600000

app.cors.allowed-origins=http://localhost:5173
