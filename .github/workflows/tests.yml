name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Frontend/student-management-frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: Frontend/student-management-frontend
        run: npm ci

      - name: Make scripts executable
        run: chmod +x run-tests.sh Backend/Hibernate/mvnw

      - name: Run test suite
        run: ./run-tests.sh
